# ─────────────────────────────────────────────────────────────────────────────
# VPS Security Dashboard — Docker Compose Stack
#
# Services:
#   caddy   — Reverse proxy with automatic HTTPS (Let's Encrypt)
#   app     — Express security dashboard (SQLite database, zero extra services)
#
# Usage:
#   cp env.template .env        # fill in your values
#   docker compose up -d        # start everything
#   docker compose logs -f      # follow logs
#   docker compose down         # stop
#
# Database:
#   SQLite file is stored in the named volume `app_data` at /app/data/security-dashboard.db
#   Backup: docker run --rm -v app_data:/data alpine tar czf - /data > backup.tar.gz
#
# SECURITY NOTE: The app container needs read access to host log files
# and limited sudo for fail2ban-client and ufw. See DEPLOYMENT.md for
# the required sudoers configuration.
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Caddy reverse proxy ────────────────────────────────────────────────────
  caddy:
    image: caddy:2.11.4-alpine
    container_name: vps-security-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3 QUIC
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      TRUSTED_IP: ${TRUSTED_IP}
    networks:
      - dashboard_net
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Security Dashboard App ─────────────────────────────────────────────────
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: vps-security-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      # ── SQLite database path inside the container ──
      SQLITE_DB_PATH: /app/data/security-dashboard.db
      # ── Required secrets (set in .env file) ──
      JWT_SECRET: ${JWT_SECRET}
      VITE_APP_ID: ${VITE_APP_ID:-}
      OAUTH_SERVER_URL: ${OAUTH_SERVER_URL:-}
      VITE_OAUTH_PORTAL_URL: ${VITE_OAUTH_PORTAL_URL:-}
      OWNER_OPEN_ID: ${OWNER_OPEN_ID:-}
      OWNER_NAME: ${OWNER_NAME:-}
      BUILT_IN_FORGE_API_KEY: ${BUILT_IN_FORGE_API_KEY:-}
      BUILT_IN_FORGE_API_URL: ${BUILT_IN_FORGE_API_URL:-}
      VITE_FRONTEND_FORGE_API_KEY: ${VITE_FRONTEND_FORGE_API_KEY:-}
      VITE_FRONTEND_FORGE_API_URL: ${VITE_FRONTEND_FORGE_API_URL:-}
      VITE_ANALYTICS_ENDPOINT: ${VITE_ANALYTICS_ENDPOINT:-}
      VITE_ANALYTICS_WEBSITE_ID: ${VITE_ANALYTICS_WEBSITE_ID:-}
    volumes:
      # Read-only access to host log files
      - /var/log:/var/log:ro
      # Run socket for fail2ban-client (requires sudoers config)
      - /run/fail2ban:/run/fail2ban:ro
      # Persistent SQLite database — single file, trivially backed up
      - app_data:/app/data
    networks:
      - dashboard_net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    expose:
      - "3000"

networks:
  dashboard_net:
    driver: bridge

volumes:
  caddy_data:
    driver: local
  caddy_config:
    driver: local
  # SQLite database volume — replaces MySQL entirely
  # Backup: docker run --rm -v vps-security-dashboard_app_data:/data alpine tar czf - /data > backup.tar.gz
  app_data:
    driver: local
