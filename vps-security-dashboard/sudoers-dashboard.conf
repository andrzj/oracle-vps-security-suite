# ─────────────────────────────────────────────────────────────────────────────
# Sudoers configuration for the VPS Security Dashboard
#
# Install this file on your VPS:
#   sudo cp sudoers-dashboard.conf /etc/sudoers.d/dashboard
#   sudo chmod 440 /etc/sudoers.d/dashboard
#   sudo visudo -c   # validate syntax
#
# This grants the 'dashboard' user (running inside Docker with host PID
# namespace) the minimum sudo permissions needed to read logs and control
# fail2ban and ufw — without granting full root access.
#
# PRINCIPLE OF LEAST PRIVILEGE: Each command is explicitly whitelisted.
# No wildcards on dangerous commands. No NOPASSWD for shell or package mgmt.
# ─────────────────────────────────────────────────────────────────────────────

# The dashboard app user (UID 1001 inside the container, mapped to host)
dashboard ALL=(ALL) NOPASSWD: /usr/bin/fail2ban-client status
dashboard ALL=(ALL) NOPASSWD: /usr/bin/fail2ban-client status *
dashboard ALL=(ALL) NOPASSWD: /usr/bin/fail2ban-client set * unbanip *
dashboard ALL=(ALL) NOPASSWD: /usr/sbin/ufw status numbered
dashboard ALL=(ALL) NOPASSWD: /usr/sbin/ufw allow *
dashboard ALL=(ALL) NOPASSWD: /usr/sbin/ufw deny *
dashboard ALL=(ALL) NOPASSWD: /usr/sbin/ufw delete *
dashboard ALL=(ALL) NOPASSWD: /usr/bin/tail -n * /var/log/auth.log
dashboard ALL=(ALL) NOPASSWD: /usr/bin/tail -n * /var/log/syslog
dashboard ALL=(ALL) NOPASSWD: /usr/bin/tail -n * /var/log/fail2ban.log
dashboard ALL=(ALL) NOPASSWD: /usr/bin/tail -n * /var/log/ufw.log
dashboard ALL=(ALL) NOPASSWD: /usr/bin/tail -n * /var/log/kern.log
dashboard ALL=(ALL) NOPASSWD: /usr/bin/grep Failed password /var/log/auth.log
dashboard ALL=(ALL) NOPASSWD: /usr/sbin/sshd -T
dashboard ALL=(ALL) NOPASSWD: /bin/systemctl is-active fail2ban
dashboard ALL=(ALL) NOPASSWD: /bin/systemctl is-active unattended-upgrades
dashboard ALL=(ALL) NOPASSWD: /bin/systemctl is-active apt-daily-upgrade
